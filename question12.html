<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple News Feed</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 20px auto; padding: 0 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { border: 1px solid #ddd; border-radius: 6px; padding: 12px; }
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 4px; }
        .meta { font-size: 12px; color: #666; margin: 8px 0; }
        h3 { margin: 5px 0; font-size: 16px; }
        p { font-size: 14px; color: #333; }
    </style>
</head>
<body>

    <h2>Live News Feed</h2>
    <input type="text" id="search" placeholder="Search news...">
    <button onclick="loadNews()">Search</button>

    <div class="grid" id="news">Loading...</div>

    <script>
        async function loadNews() {
            const query = document.getElementById("search").value;
            const url = `https://api.spaceflightnewsapi.net/v4/articles/?limit=6&search=${query}`;
            
            const res = await fetch(url);
            const data = await res.json();

            document.getElementById("news").innerHTML = data.results.map(item => `
                <div class="card">
                    <img src="${item.image_url}" alt="news">
                    <div class="meta">${item.news_site} • ${new Date(item.published_at).toLocaleDateString()}</div>
                    <h3><a href="${item.url}" target="_blank">${item.title}</a></h3>
                    <p>${item.summary.slice(0, 100)}...</p>
                </div>
            `).join("");
        }

        loadNews(); // Load automatically on page open
    </script>

</body>
</html>
