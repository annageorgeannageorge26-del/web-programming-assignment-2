<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Pixel Designs mark">
  <!-- 5x5 grid of blocks arranged into a "P", echoing the brand name and the
       services grid used throughout the site. Cell size 18, gutter 2.5. -->
  <g fill="#14140F">
    <!-- column 1 (full height) -->
    <rect x="6"  y="6"  width="16" height="16"/>
    <rect x="6"  y="24.5" width="16" height="16"/>
    <rect x="6"  y="43"  width="16" height="16"/>
    <rect x="6"  y="61.5" width="16" height="16"/>
    <rect x="6"  y="80"  width="16" height="14"/>
    <!-- top bar -->
    <rect x="24.5" y="6" width="16" height="16"/>
    <rect x="43"   y="6" width="16" height="16"/>
    <rect x="61.5" y="6" width="16" height="16"/>
    <!-- right side of the bowl -->
    <rect x="80" y="24.5" width="14" height="16"/>
    <!-- middle bar -->
    <rect x="61.5" y="43" width="16" height="16"/>
    <rect x="43"   y="43" width="16" height="16"/>
    <rect x="24.5" y="43" width="16" height="16"/>
  </g>
  <!-- single signal-colour block: the one deliberate accent -->
  <rect x="80" y="6" width="14" height="16" fill="#FF4B2B"/>
</svg>
