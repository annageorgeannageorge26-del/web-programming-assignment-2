<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            padding: 40px;
        }

        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #aaa;
        }

        h2 {
            text-align: center;
        }

        input, textarea {
            width: 95%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0d47a1;
        }
    </style>

</head>

<body>

    <div class="container">

        <h2>Contact Form</h2>

        <form action="/submit" method="POST">

            <label>Name:</label>

            <input type="text"
                   name="name"
                   placeholder="Enter your name"
                   required>

            <label>Email:</label>

            <input type="email"
                   name="email"
                   placeholder="Enter your email"
                   required>

            <label>Message:</label>

            <textarea name="message"
                      placeholder="Enter your message"
                      rows="5"
                      required></textarea>

            <button type="submit">Submit</button>

        </form>

    </div>

</body>
</html>
